version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Shared library changes also need matching runtime/lockfile metadata.
    # The central rollout coordinator owns these updates.
    ignore:
      - dependency-name: "budget-buddy-org/ci-workflows*"
    commit-message:
      prefix: "chore"

  # Maintain dependencies for gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # Maintain dependencies for npm (semantic-release tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
