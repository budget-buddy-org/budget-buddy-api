    branches:
      - main
    paths:
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-submission.yaml'
      - 'gradle.properties'


permissions:
  contents: write
  packages: read

jobs:
