name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build (defaults to the dispatched ref)
        type: string
        default: ''
      publish:
        description: Promote production tags (requires a matching release tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: budget-buddy-org/ci-workflows/.github/workflows/gradle-publish.yml@0b14ee3095313a6906c77a8989ae4c46b6790f22
    with:
      ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
      publish: ${{ github.event_name == 'release' || inputs.publish }}
