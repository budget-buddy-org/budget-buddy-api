name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build (defaults to the dispatched ref)
        type: string
        default: ''
      publish:
        description: Promote production tags (requires a matching release tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: image-build-${{ github.repository }}-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
      node-version: ${{ steps.metadata.outputs.node-version }}
      pnpm-version: ${{ steps.metadata.outputs.pnpm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
      - uses: budget-buddy-org/ci-workflows/.github/actions/image-metadata@fefeb0e74f0ed0e5a0c6949f83ddfd8676864f3d
        id: metadata
        with:
          version-file: gradle.properties
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
          publish: ${{ github.event_name == 'release' || inputs.publish }}
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: budget-buddy-org/ci-workflows/.github/actions/setup-container@fefeb0e74f0ed0e5a0c6949f83ddfd8676864f3d
      - uses: budget-buddy-org/ci-workflows/.github/actions/setup-gradle@fefeb0e74f0ed0e5a0c6949f83ddfd8676864f3d
      - name: Build and push a staging image on the native platform
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$ARCH"
          ./gradlew bootBuildImage -x test --imagePlatform="$PLATFORM" --imageName="$tag"
          docker push "$tag"
          ref=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - uses: budget-buddy-org/ci-workflows/.github/actions/image-record@fefeb0e74f0ed0e5a0c6949f83ddfd8676864f3d
        with:
          digest: ${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          version: ${{ needs.prepare.outputs.version }}
          source-sha: ${{ needs.prepare.outputs.source-sha }}
  publish:
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: budget-buddy-org/ci-workflows/.github/workflows/publish-image.yml@fefeb0e74f0ed0e5a0c6949f83ddfd8676864f3d
    with:
      version: ${{ needs.prepare.outputs.version }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      publish: ${{ github.event_name == 'release' || inputs.publish }}
