name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
      - 'gradle.properties'
      - 'docker-compose*.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
      - 'gradle.properties'
      - 'docker-compose*.yaml'
  workflow_dispatch:
    inputs:
      dry-run-release:
        description: Preview release from this ref
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/gradle-ci.yml@6ca650db05a934bd612faac664149938e763cfed
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry-run-release)
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/release.yml@6ca650db05a934bd612faac664149938e763cfed
    with:
      profile: application
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
