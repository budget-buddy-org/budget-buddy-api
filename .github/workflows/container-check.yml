name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/gradle-image-check.yml@b7507539ebca6a6c2ba7da83a40033527fc5e85f
