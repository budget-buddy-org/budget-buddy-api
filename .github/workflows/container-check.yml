name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/ci-workflows/.github/workflows/gradle-image-check.yml@4652a0281ab4c381ff1bd8b60c0cf8f6fd9d76fc
