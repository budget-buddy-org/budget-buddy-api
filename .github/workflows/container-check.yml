name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/ci-workflows/.github/workflows/gradle-image-check.yml@306f06148d1b17242b36121967613ded7380ddaf
