name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/gradle-image-check.yml@301c990d07dae55fc8f03ea63322a208aa8d0d1e
