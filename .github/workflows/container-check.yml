name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/ci-workflows/.github/workflows/gradle-image-check.yml@0b14ee3095313a6906c77a8989ae4c46b6790f22
